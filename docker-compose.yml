services:
  postgres:
    image: postgres:17-alpine
    container_name: company-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-company_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-nas}
      POSTGRES_DB: ${POSTGRES_DB:-company_erp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${NAS_DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:17-alpine
    container_name: company-erp-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-company_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-nas}
      POSTGRES_DB: ${POSTGRES_DB:-company_erp}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/run-migrations.sh"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        APP_PACKAGE_VERSION: ${APP_PACKAGE_VERSION:-0.1.0}
    container_name: company-erp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-company_erp}:${POSTGRES_PASSWORD:-change-me-in-nas}@postgres:5432/${POSTGRES_DB:-company_erp}?schema=public
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-change-me-long-random-local-secret}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      IDENTITY_ENCRYPTION_SECRET: ${IDENTITY_ENCRYPTION_SECRET:-change-me-long-random-identity-secret}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
      APP_DEPLOYED_AT: ${APP_DEPLOYED_AT:-unknown}
      APP_PACKAGE_VERSION: ${APP_PACKAGE_VERSION:-0.1.0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-nas}
    volumes:
      - ${NAS_ATTACHMENTS_ROOT:-./attachments}:/attachments
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: company-erp-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ERP_WEB_PORT:-8080}:80"
