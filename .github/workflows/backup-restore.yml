name: Backup Restore Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

jobs:
  backup-restore:
    name: Verify pg_dump restore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run backup/restore verification
        run: scripts/test-backup-restore.sh
